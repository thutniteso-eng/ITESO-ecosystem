name: iteso-ecosystem

services:
  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - iteso_internal

  odoo:
    image: odoo:20.0-20261123
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/etc/odoo/start-odoo.sh"]
    environment:
      HOST: postgres
      PORT: "5432"
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?ODOO_ADMIN_PASSWORD is required in .env}
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
    volumes:
      - odoo_data:/var/lib/odoo
      - ../odoo-addons:/mnt/extra-addons:ro
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./odoo/start-odoo.sh:/etc/odoo/start-odoo.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8069/web/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - iteso_internal

  nats:
    image: nats:2.15.3
    restart: unless-stopped
    command: ["-m", "8222"]
    networks:
      - iteso_internal

  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - iteso_internal

  control-plane:
    build:
      context: ..
      dockerfile: services/control-plane/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CONTROL_PLANE_PORT: 3100
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_CONTROL_PLANE_USER: ${POSTGRES_CONTROL_PLANE_USER:-iteso_control_plane}
      POSTGRES_CONTROL_PLANE_PASSWORD: ${POSTGRES_CONTROL_PLANE_PASSWORD:?POSTGRES_CONTROL_PLANE_PASSWORD is required in .env}
      PLATFORM_DB: ${PLATFORM_DB:-platform}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      PLATFORM_ENCRYPTION_KEY: ${PLATFORM_ENCRYPTION_KEY:-}
      PLATFORM_ENCRYPTION_KEY_PATH: /app/secrets/platform_encryption.key
      DEMO_ACCOUNTS_PASSWORD: ${DEMO_ACCOUNTS_PASSWORD:?DEMO_ACCOUNTS_PASSWORD is required in .env}
      JWT_KEY_ID: ${JWT_KEY_ID:-iteso-ed25519-key-1}
      JWT_PRIVATE_KEY_PATH: /app/secrets/ed25519_private.pem
      JWT_PUBLIC_KEY_PATH: /app/secrets/ed25519_public.pem
      ODOO_CREDENTIALS_KEY_PATH: /app/secrets/odoo_credentials.key
      ODOO_MEMBER_KEY_TTL_DAYS: ${ODOO_MEMBER_KEY_TTL_DAYS:-90}
      ODOO_URL: http://odoo:8069
      INTERNAL_API_TOKEN_PATH: /app/secrets/internal_api.token
    volumes:
      - ./secrets/ed25519_private.pem:/app/secrets/ed25519_private.pem:ro
      - ./secrets/ed25519_public.pem:/app/secrets/ed25519_public.pem:ro
      - ./secrets/platform_encryption.key:/app/secrets/platform_encryption.key:ro
      - ./secrets/odoo_credentials.key:/app/secrets/odoo_credentials.key:ro
      - ./secrets/internal_api.token:/app/secrets/internal_api.token:ro
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - iteso_internal

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_healthy
      odoo:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      GATEWAY_PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_GATEWAY_USER:-iteso_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_GATEWAY_PASSWORD:?POSTGRES_GATEWAY_PASSWORD is required in .env}
      POSTGRES_DB: ${PLATFORM_DB:-platform}
      PLATFORM_DB: ${PLATFORM_DB:-platform}
      ODOO_URL: http://odoo:8069
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      CONTROL_PLANE_URL: http://control-plane:3100
      JWT_KEY_ID: ${JWT_KEY_ID:-iteso-ed25519-key-1}
      JWT_PUBLIC_KEY_PATH: /app/secrets/ed25519_public.pem
      ODOO_CREDENTIALS_KEY_PATH: /app/secrets/odoo_credentials.key
      INTERNAL_API_TOKEN_PATH: /app/secrets/internal_api.token
    volumes:
      - ./secrets/ed25519_public.pem:/app/secrets/ed25519_public.pem:ro
      - ./secrets/odoo_credentials.key:/app/secrets/odoo_credentials.key:ro
      - ./secrets/internal_api.token:/app/secrets/internal_api.token:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - iteso_internal

volumes:
  postgres_data:
  odoo_data:

networks:
  iteso_internal:
    driver: bridge
