name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  services-ci:
    name: Lint, Typecheck & Test Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test services
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify OpenAPI generated client sync
        run: |
          pnpm gen:api
          git diff --exit-code packages/api-client

  compose-integration-ci:
    name: Compose Stack & Integration Scenarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare .env from .env.example
        run: |
          cp .env.example .env
          sed -i 's/^DEMO_ACCOUNTS_PASSWORD=.*/DEMO_ACCOUNTS_PASSWORD=Admin@1234567/' .env

      - name: Generate Ed25519 keypair
        run: |
          ./scripts/generate-keys.sh
          sudo chown -R 1000:1000 infra/secrets

      - name: Start PostgreSQL and initialize roles
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml up -d --wait postgres
          ./scripts/init-db-roles.sh

      - name: Build control-plane and run migrations & seed on platform DB
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml build control-plane
          docker compose --env-file .env -f infra/docker-compose.yml run --rm control-plane node dist/db/migrate.js
          docker compose --env-file .env -f infra/docker-compose.yml run --rm control-plane node dist/db/seed.js

      - name: Start Compose stack
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --build --wait

      - name: Create platform admin account
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml exec -T control-plane \
            node dist/cli/create-platform-admin.js --email admin@platform.local --password "AdminPassword@123" --totp-secret "JBSWY3DPEHPK3PXP"

      - name: Initialize demo tenant t_demo_fnb
        run: |
          ./scripts/init-demo-tenant.sh
          docker compose --env-file .env -f infra/docker-compose.yml exec -T control-plane \
            node dist/cli/provision-odoo-users.js --tenant demo_fnb

      - name: Verify DB isolation and tenant security
        run: ./scripts/test-db-isolation.sh

      - name: Verify iteso_base installs and passes unit tests on fresh test database
        run: ./scripts/test-odoo-module.sh

      - name: Verify gateway endpoints & feature flags scenario
        run: |
          # 1. /health ok
          curl -fsS http://localhost:3000/health | tee /dev/stderr | grep -q '"status":"ok"'

          # 2. Odoo db manager disabled
          curl -fsS http://localhost:8069/web/database/manager | grep -q "The database manager has been disabled by the administrator"

          # 3. Acceptance criteria integration verification
          node scripts/test-acceptance-criteria.js
          node scripts/test-acceptance-criteria-task006.js

      - name: Install Playwright browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E tests against live admin-web & compose stack
        run: pnpm test:e2e

      - name: Upload Playwright screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-screenshots
          path: artifacts/admin-web-screenshots/
          if-no-files-found: warn

      - name: Tear down Compose stack
        if: always()
        run: |
          docker compose --env-file .env -f infra/docker-compose.yml logs || true
          docker compose --env-file .env -f infra/docker-compose.yml down -v
